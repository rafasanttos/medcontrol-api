<form [formGroup]="formulario" (ngSubmit)="criar()">

  <p>Clínica</p>

  <input
    type="text"
    placeholder="Nome"
    formControlName="nome">

  <input
    type="email"
    placeholder="E-mail"
    formControlName="email">

  <input
    type="password"
    placeholder="Senha"
    formControlName="password">

  <button
    type="submit"
    [disabled]="formulario.invalid">
    Criar conta
  </button>

  <div class="login-link">
    Já possui conta?
    <a routerLink="/">Fazer login</a>
  </div>

</form>
