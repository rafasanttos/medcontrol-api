<form [formGroup]="formulario" (ngSubmit)="criar()">

  <p>Clínica</p>

  <input
    type="text"
    placeholder="Nome"
    formControlName="nome">

  <input
    type="email"
    placeholder="E-mail"
    formControlName="email">

  <input
    type="password"
    placeholder="Senha"
    formControlName="password">

  <button
    type="submit"
    [disabled]="formulario.invalid || carregando ">
    {{carregando?'Criando seu cadastro...':'Criar conta'}}
  </button>
  <p class="loading" *ngIf="carregando">
    Criando seu cadastro, aguarde...
  </p>

  <div class="login-link">
    Já possui conta?
    <a href="/">Fazer login</a>
  </div>

</form>
